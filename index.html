<title>花朝的工作台</title>
<style>
  :root {
    --green-50: #f4f9ed;
    --green-100: #e6f1d6;
    --green-200: #cfe3b3;
    --green-300: #b3d188;
    --green-400: #94c162;
    --green-500: #7BAE5C;
    --green-600: #5d8a45;
    --green-700: #466833;
    --yellow-50: #fffbef;
    --yellow-100: #fdf3d4;
    --yellow-200: #fae6a3;
    --yellow-300: #f5d770;
    --yellow-400: #efc94c;
    --yellow-500: #e6b934;
    --ink-100: #f7f4ec;
    --ink-200: #ece6d6;
    --ink-300: #d8cfb8;
    --ink-500: #6e6552;
    --ink-700: #3d3826;
    --ink-900: #1f1d12;
    --shadow-soft: 0 4px 16px rgba(125, 158, 89, 0.12);
    --shadow-card: 0 2px 10px rgba(125, 158, 89, 0.08);
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-xl: 28px;
    --topbar-h: 65px;
    --font-serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "LXGW WenKai", "FangSong", "KaiTi", serif;
    --font-sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }
  body {
    font-family: var(--font-sans);
    background: linear-gradient(135deg, #fdf9ec 0%, #f4f9ed 50%, #fffbef 100%);
    color: var(--ink-700);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; color: inherit; }

  /* ============== Layout ============== */
  #app {
    position: fixed; inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  #sidebar {
    position: absolute;
    left: 0; top: var(--topbar-h); bottom: 0;
    width: 78%;
    max-width: 320px;
    min-width: 260px;
    background: linear-gradient(180deg, #fdfaef 0%, #f6f5e8 100%);
    border-right: 1px solid var(--ink-200);
    box-shadow: 4px 0 24px rgba(125, 158, 89, 0.12);
    display: flex; flex-direction: column;
    z-index: 20;
    transition: transform 0.32s cubic-bezier(0.22, 0.61, 0.36, 1);
    will-change: transform;
  }
  #sidebar.hidden { transform: translateX(-100%); }

  #scrim {
    position: absolute; inset: 0;
    background: rgba(20, 20, 14, 0.42);
    z-index: 15;
    opacity: 0; pointer-events: none;
    transition: opacity 0.32s ease;
  }
  #scrim.show { opacity: 1; pointer-events: auto; }

  .brand {
    padding: 24px 22px 16px 22px;
    border-bottom: 1px dashed var(--ink-200);
  }
  .brand h1 {
    margin: 0 0 6px 0;
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 24px;
    color: var(--green-600);
    letter-spacing: 2px;
  }
  .brand .sub {
    font-family: var(--font-serif);
    font-size: 13px;
    color: var(--ink-500);
    letter-spacing: 1.5px;
  }

  .nav-list {
    flex: 1; overflow-y: auto;
    padding: 14px 12px 14px 12px;
    -webkit-overflow-scrolling: touch;
  }
  .nav-item {
    display: flex; align-items: center;
    padding: 13px 14px;
    margin-bottom: 6px;
    border-radius: var(--radius-md);
    color: var(--ink-700);
    font-size: 15px;
    transition: background 0.2s, color 0.2s, transform 0.2s;
    user-select: none;
    cursor: pointer;
    position: relative;
  }
  .nav-item:active { transform: scale(0.98); }
  .nav-item .ico { font-size: 20px; margin-right: 12px; line-height: 1; }
  .nav-item .label { flex: 1; font-family: var(--font-serif); letter-spacing: 1px; }
  .nav-item.active {
    background: linear-gradient(135deg, var(--green-100) 0%, var(--yellow-100) 100%);
    color: var(--green-700);
    font-weight: 600;
  }
  .nav-item.active::before {
    content: '';
    position: absolute; left: -2px; top: 18%; bottom: 18%;
    width: 4px; border-radius: 4px;
    background: var(--green-500);
  }

  .nav-tools {
    display: flex; gap: 6px; margin-left: 6px;
  }
  .icon-btn {
    border: none; background: transparent;
    color: var(--ink-500);
    padding: 4px;
    border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover { background: var(--ink-100); color: var(--green-600); }
  .icon-btn svg { width: 16px; height: 16px; }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px dashed var(--ink-200);
    display: flex; gap: 8px;
  }
  .pill-btn {
    flex: 1;
    border: 1px solid var(--green-200);
    background: white;
    color: var(--green-700);
    border-radius: 999px;
    padding: 8px 10px;
    font-size: 13px;
    transition: background 0.15s;
  }
  .pill-btn:active { background: var(--green-50); }

  .data-bar {
    padding: 10px 16px 14px 16px;
    border-top: 1px dashed var(--ink-200);
    display: flex; align-items: center; justify-content: space-between;
  }
  .data-label {
    font-family: var(--font-serif);
    font-size: 13px;
    color: var(--ink-500);
    letter-spacing: 1px;
  }
  .data-btns { display: flex; gap: 8px; }
  .mini-btn {
    border: 1px solid var(--yellow-300);
    background: var(--yellow-50);
    color: #6b5400;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    transition: background 0.15s;
  }
  .mini-btn:active { background: var(--yellow-200); }

  .update-btn {
    border: 1px solid var(--green-300);
    background: white;
    color: var(--green-700);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .update-btn:active { background: var(--green-50); }
  .update-btn.has-new {
    background: var(--yellow-100);
    border-color: var(--yellow-400);
    color: #6b5400;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  /* Main */
  #main {
    position: absolute;
    left: 0; top: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, #fffdf3 0%, #f8faeb 100%);
    min-width: 0;
  }

  .topbar {
    flex: 0 0 auto;
    height: var(--topbar-h);
    padding: 14px 18px 12px 18px;
    box-sizing: border-box;
    background: rgba(255, 252, 240, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--ink-200);
    display: flex; align-items: center; gap: 10px;
    position: relative; z-index: 30;
  }
  .menu-btn {
    width: 38px; height: 38px;
    border: 1px solid var(--ink-200);
    background: white;
    border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--green-700);
    transition: background 0.15s;
  }
  .menu-btn:active { background: var(--green-50); }
  .menu-btn svg { width: 20px; height: 20px; }

  .topbar-title {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    line-height: 1.25;
  }
  .topbar-title .name {
    font-family: var(--font-serif);
    font-size: 18px;
    color: var(--green-700);
    font-weight: 600;
    letter-spacing: 1.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar-title .date {
    font-size: 12px;
    color: var(--ink-500);
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  .date-nav {
    display: flex; align-items: center; gap: 4px;
  }
  .date-nav button {
    width: 30px; height: 30px;
    border: 1px solid var(--ink-200);
    background: white;
    border-radius: 50%;
    color: var(--ink-500);
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .date-nav button:active { background: var(--yellow-50); }
  .date-nav button svg { width: 14px; height: 14px; }
  .date-nav button:disabled { opacity: 0.35; }

  /* Content */
  .content {
    flex: 1; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 16px 100px 16px;
  }
  .section {
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid var(--ink-200);
    border-radius: var(--radius-lg);
    padding: 16px 16px 12px 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-card);
  }
  .section-title {
    display: flex; align-items: center;
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 16px;
    color: var(--green-700);
    margin: 0 0 12px 0;
    letter-spacing: 1.5px;
  }
  .section-title::before {
    content: '';
    width: 6px; height: 16px;
    background: linear-gradient(180deg, var(--green-500), var(--yellow-400));
    border-radius: 3px;
    margin-right: 10px;
  }
  .section-title .actions { margin-left: auto; display: flex; gap: 4px; }
  .section-title .actions button {
    border: none; background: transparent;
    color: var(--ink-500);
    padding: 4px 7px;
    border-radius: 6px;
    font-size: 15px;
  }
  .section-title .actions button:active { background: var(--green-50); }
  .section-title .actions svg { width: 16px; height: 16px; }

  /* Check item list */
  .check-list { list-style: none; margin: 0; padding: 0; }
  .check-item {
    display: flex; align-items: center;
    padding: 10px 8px;
    border-radius: 10px;
    transition: background 0.15s;
    gap: 10px;
  }
  .check-item:active { background: var(--ink-100); }
  .check-item .checkbox {
    width: 22px; height: 22px;
    border: 1.6px solid var(--green-300);
    border-radius: 7px;
    flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.2s, border-color 0.2s;
    background: white;
  }
  .check-item.done .checkbox {
    background: var(--green-500);
    border-color: var(--green-500);
  }
  .check-item.done .checkbox svg { display: block; }
  .check-item .checkbox svg { display: none; width: 14px; height: 14px; color: white; }
  .check-item .name {
    flex: 1; min-width: 0;
    font-size: 15px;
    color: var(--ink-700);
    word-break: break-all;
  }
  .check-item.done .name {
    text-decoration: line-through;
    color: var(--ink-500);
  }
  .check-item .item-tools { display: flex; gap: 2px; opacity: 0; transition: opacity 0.2s; }
  .check-item:hover .item-tools, .check-item:focus-within .item-tools { opacity: 1; }
  .check-item .item-tools button {
    border: none; background: transparent;
    color: var(--ink-500);
    padding: 4px;
    border-radius: 6px;
  }
  .check-item .item-tools button:active { background: var(--ink-100); }
  .check-item .item-tools svg { width: 14px; height: 14px; }

  /* Add new item */
  .add-row {
    display: flex; gap: 8px; margin-top: 10px;
  }
  .add-row input {
    flex: 1; min-width: 0;
    border: 1px dashed var(--ink-300);
    background: transparent;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .add-row input:focus { border-color: var(--green-400); background: white; }
  .add-row button {
    border: none;
    background: var(--green-500);
    color: white;
    border-radius: 10px;
    padding: 0 14px;
    font-size: 14px;
    font-weight: 500;
  }
  .add-row button:active { background: var(--green-600); }

  /* Textarea */
  .textarea {
    width: 100%;
    border: 1px dashed var(--ink-300);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.75;
    background: rgba(255, 255, 255, 0.6);
    color: var(--ink-700);
    outline: none;
    resize: vertical;
    min-height: 90px;
    font-family: var(--font-sans);
    transition: border-color 0.2s, background 0.2s;
  }
  .textarea:focus { border-color: var(--green-400); background: white; border-style: solid; }
  .textarea.tall { min-height: 160px; }

  /* Health grid */
  .form-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
  }
  .form-field {
    display: flex; flex-direction: column; gap: 4px;
    min-width: 0;
  }
  .form-field label {
    font-size: 12px;
    color: var(--ink-500);
    letter-spacing: 0.5px;
  }
  .form-field input, .form-field select, .form-field textarea {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    border: 1px solid var(--ink-200);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 14px;
    background: white;
    outline: none;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
    border-color: var(--green-400);
  }
  .form-field.full { grid-column: 1 / -1; }

  /* Images */
  .image-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .image-card {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    overflow: hidden;
    background: var(--ink-100);
  }
  .image-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .image-card .rm {
    position: absolute; top: 4px; right: 4px;
    width: 22px; height: 22px;
    background: rgba(0, 0, 0, 0.55);
    color: white;
    border: none;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .image-card .rm svg { width: 12px; height: 12px; }
  .image-add {
    aspect-ratio: 1 / 1;
    border: 1.5px dashed var(--green-300);
    border-radius: 12px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--green-600);
    background: rgba(125, 174, 92, 0.04);
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .image-add:active { background: rgba(125, 174, 92, 0.12); }
  .image-add svg { width: 24px; height: 24px; margin-bottom: 4px; }
  .image-add.row {
    aspect-ratio: auto;
    flex-direction: row;
    gap: 6px;
    padding: 13px;
    margin-top: 10px;
    width: 100%;
    font-size: 13px;
  }
  .image-add.row svg { width: 18px; height: 18px; margin-bottom: 0; }

  .video-add {
    display: flex; flex-direction: row; gap: 6px;
    align-items: center; justify-content: center;
    width: 100%; padding: 14px; margin-top: 8px;
    border: 1.5px dashed var(--green-400);
    border-radius: 12px;
    color: var(--green-700);
    background: rgba(125, 174, 92, 0.06);
    font-size: 14px; cursor: pointer;
    transition: background 0.15s;
  }
  .video-add:active { background: rgba(125, 174, 92, 0.14); }
  .video-add svg { width: 20px; height: 20px; }
  .video-add.sm { padding: 10px; font-size: 13px; }
  .video-list { margin-top: 10px; display: flex; flex-direction: column; gap: 12px; }
  .video-item { background: rgba(125,174,92,0.05); border: 1px solid var(--ink-200); border-radius: 12px; padding: 8px; }
  .video-item video { width: 100%; border-radius: 8px; background: #000; display: block; }
  .video-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 8px; }

  .vcheck {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--ink-500);
    border: 1px solid var(--ink-200);
    background: white;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer; user-select: none;
    transition: all 0.15s;
  }
  .vcheck::before { content: '○'; font-size: 12px; }
  .vcheck.on {
    background: var(--green-100);
    border-color: var(--green-400);
    color: var(--green-700);
    font-weight: 600;
  }
  .vcheck.on::before { content: '✓'; }

  /* Link list */
  .link-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .link-row {
    display: flex; align-items: center; gap: 10px;
    background: white;
    border: 1px solid var(--ink-200);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .link-row .meta { flex: 1; min-width: 0; }
  .link-row .title { font-size: 14px; color: var(--ink-700); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-row .url { font-size: 11px; color: var(--ink-500); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .link-row .rm {
    border: none; background: transparent; color: var(--ink-500);
    padding: 4px;
  }
  .link-row .rm:active { color: #c0392b; }

  /* Empty */
  .empty {
    text-align: center;
    color: var(--ink-500);
    font-size: 13px;
    padding: 18px 8px;
  }

  /* AI action box */
  .ai-box {
    background: linear-gradient(135deg, var(--yellow-50), var(--green-50));
    border: 1px solid var(--yellow-200);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 14px;
    color: var(--ink-700);
    line-height: 1.8;
    min-height: 100px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .ai-box:empty::before {
    content: '点击下方「AI 草稿」按钮，一键生成内容（可手动编辑调整）';
    color: var(--ink-500);
    font-style: italic;
  }
  .ai-actions {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 10px;
  }
  .btn {
    border: 1px solid var(--green-300);
    background: white;
    color: var(--green-700);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    transition: background 0.15s, color 0.15s;
  }
  .btn:active { background: var(--green-50); }
  .btn.primary { background: var(--green-500); color: white; border-color: var(--green-500); }
  .btn.primary:active { background: var(--green-600); }
  .btn.warm { background: var(--yellow-300); color: #5d4a00; border-color: var(--yellow-300); }
  .btn.warm:active { background: var(--yellow-400); }

  /* ============== 今日概览（进度 + 连续天数） ============== */
  .ov-row { display: flex; align-items: center; gap: 12px; }
  .ov-left { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .ov-label { font-family: var(--font-serif); font-size: 13px; color: var(--ink-500); white-space: nowrap; letter-spacing: 1px; }
  .ov-num { font-size: 13px; font-weight: 600; color: var(--green-700); white-space: nowrap; }
  .ov-bar { flex: 1; height: 8px; background: var(--green-50); border-radius: 999px; overflow: hidden; border: 1px solid var(--green-100); }
  .ov-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green-400), var(--yellow-400)); border-radius: 999px; transition: width .35s ease; }
  .ov-streak {
    font-size: 13px; color: #b3541e;
    background: linear-gradient(135deg, #fff4e3, #ffe9cc);
    border: 1px solid #f3d9ac;
    padding: 6px 12px; border-radius: 999px;
    white-space: nowrap;
  }

  /* ============== 左右滑动卡片（随心记 / 灵感 / 碎话本） ============== */
  /* ============== 经期月度日历 ============== */
  .period-cal {
    --pink-50: #fff0f5;
    --pink-200: #ffc1d9;
    --pink-400: #ff7aab;
    --pink-500: #ff4d94;
    --pink-600: #e63a82;
    --purple-300: #d4a8f0;
    --purple-500: #b97ee0;
    --purple-700: #8a4dbf;
  }
  .period-cal .cal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 2px 12px 2px;
  }
  .period-cal .cal-head .cal-title {
    font-family: var(--font-serif);
    font-size: 17px; font-weight: 600;
    color: var(--pink-600);
    letter-spacing: 1px;
  }
  .period-cal .cal-nav {
    display: flex; gap: 6px;
  }
  .period-cal .cal-nav button {
    width: 30px; height: 30px;
    border: 1px solid var(--pink-200);
    background: white;
    color: var(--pink-600);
    border-radius: 8px;
    font-size: 14px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .period-cal .cal-nav button:active { background: var(--pink-50); }
  .period-cal .cal-today-btn {
    height: 30px; padding: 0 12px;
    border: 1px solid var(--pink-200);
    background: white;
    color: var(--pink-600);
    border-radius: 999px;
    font-size: 12px;
    transition: background .15s;
  }
  .period-cal .cal-today-btn:active { background: var(--pink-50); }
  .period-cal .cal-week,
  .period-cal .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .period-cal .cal-week {
    margin-bottom: 6px;
  }
  .period-cal .cal-week span {
    text-align: center;
    font-family: var(--font-serif);
    font-size: 12px;
    color: var(--ink-500);
    padding: 4px 0;
    letter-spacing: 1px;
  }
  .period-cal .cal-cell {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    background: #fafafa;
    border: 1px solid transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform .15s, border-color .15s;
    user-select: none;
  }
  .period-cal .cal-cell.empty {
    cursor: default;
    background: transparent;
  }
  .period-cal .cal-cell:active { transform: scale(0.96); }
  .period-cal .cal-cell .d {
    font-size: 14px;
    color: var(--ink-700);
    font-weight: 500;
    z-index: 2;
  }
  .period-cal .cal-cell.future .d { color: var(--ink-300); }
  .period-cal .cal-cell.out .d { color: var(--ink-300); }
  /* 经期：实心粉色 */
  .period-cal .cal-cell.period {
    background: var(--pink-500);
  }
  .period-cal .cal-cell.period .d { color: white; font-weight: 600; }
  /* 排卵期：紫色背景 */
  .period-cal .cal-cell.fertile {
    background: var(--purple-300);
  }
  .period-cal .cal-cell.fertile .d { color: var(--purple-700); font-weight: 600; }
  /* 排卵日：实心紫色 */
  .period-cal .cal-cell.ovulation {
    background: var(--purple-500);
  }
  .period-cal .cal-cell.ovulation .d { color: white; font-weight: 600; }
  /* 今天：红框 */
  .period-cal .cal-cell.today {
    border: 2px solid #ff4757;
  }
  /* 当前选中：黄色环 */
  .period-cal .cal-cell.selected {
    outline: 2px solid var(--yellow-400);
    outline-offset: -2px;
  }
  /* 爱心图标（右上角小角标） */
  .period-cal .cal-cell .mark {
    position: absolute;
    top: 2px; right: 3px;
    font-size: 9px;
    line-height: 1;
    z-index: 3;
    pointer-events: none;
  }
  .period-cal .cal-cell.period .mark,
  .period-cal .cal-cell.ovulation .mark,
  .period-cal .cal-cell.fertile .mark {
    /* 这些底色深的格子里，爱心用白色 */
    color: white;
  }

  /* 图例 */
  .period-cal .cal-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--ink-200);
    font-size: 12px;
    color: var(--ink-500);
  }
  .period-cal .cal-legend .lg {
    display: inline-flex; align-items: center; gap: 5px;
  }
  .period-cal .cal-legend .lg .sw {
    width: 12px; height: 12px;
    border-radius: 3px;
    display: inline-block;
  }
  .period-cal .cal-legend .lg .sw.p { background: var(--pink-500); }
  .period-cal .cal-legend .lg .sw.f { background: var(--purple-300); }
  .period-cal .cal-legend .lg .sw.o { background: var(--purple-500); }
  .period-cal .cal-legend .lg .sw.t { background: white; border: 2px solid #ff4757; }
  .period-cal .cal-legend .lg .sw.h-out {
    color: #ff4d94;
    font-size: 12px;
    line-height: 1;
  }
  .period-cal .cal-legend .lg .sw.h-full {
    color: #ff4d94;
    font-size: 12px;
    line-height: 1;
  }

  /* 当日操作面板 */
  .period-day-panel {
    margin-top: 14px;
    padding: 12px;
    background: #fff5f8;
    border: 1px solid var(--pink-200);
    border-radius: var(--radius-md);
  }
  .period-day-panel .pd-title {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--font-serif);
    font-size: 14px;
    color: var(--pink-600);
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  .period-day-panel .pd-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0;
    border-top: 1px dashed #ffd6e6;
    font-size: 14px;
    color: var(--ink-700);
  }
  .period-day-panel .pd-row:first-of-type { border-top: none; }
  .period-day-panel .pd-row .pd-label {
    flex: 1;
    font-family: var(--font-serif);
    letter-spacing: 0.5px;
  }
  /* 大姨妈是否来了：粉/灰胶囊按钮 */
  .period-day-panel .pd-row .pd-y {
    display: inline-flex;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--pink-200);
    background: white;
    font-size: 13px;
  }
  .period-day-panel .pd-row .pd-y button {
    border: none;
    background: transparent;
    color: var(--ink-500);
    padding: 5px 14px;
    transition: background .15s, color .15s;
  }
  .period-day-panel .pd-row .pd-y button.on.yes {
    background: var(--pink-500);
    color: white;
  }
  .period-day-panel .pd-row .pd-y button.on.no {
    background: #d8cfb8;
    color: white;
  }
  /* 爱心切换按钮 */
  .period-day-panel .pd-heart {
    width: 34px; height: 34px;
    border: 1px solid var(--pink-200);
    background: white;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 18px; line-height: 1;
    transition: background .15s, transform .15s;
  }
  .period-day-panel .pd-heart:active { transform: scale(0.92); }
  .period-day-panel .pd-heart.empty {
    color: #ff7aab;
  }
  .period-day-panel .pd-heart.full {
    background: var(--pink-500);
    border-color: var(--pink-500);
    color: white;
  }
  /* 经期症状输入 */
  .period-day-panel .pd-symptoms {
    width: 100%;
    margin-top: 6px;
    border: 1px solid var(--pink-200);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 13px;
    background: white;
    outline: none;
    resize: vertical;
    min-height: 56px;
    font-family: inherit;
  }
  .period-day-panel .pd-symptoms:focus { border-color: var(--pink-500); }
  .period-day-panel .pd-symptoms::placeholder { color: #c89aab; }

  .empty {
    color: var(--ink-500);
    text-align: center;
    padding: 14px 0;
    font-size: 13px;
  }

  .swipe-deck { margin-top: 2px; }
  .swipe-track {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .swipe-track::-webkit-scrollbar { display: none; }
  .swipe-card {
    flex: 0 0 calc(100% - 4px);
    scroll-snap-align: start;
    background: white;
    border: 1px solid var(--ink-200);

/* ============================================================
   状态与数据层
   ============================================================ */
let state = {
  categories: [],
  currentCategory: null,
  currentDate: '',
  data: {},
  settings: {},
  weeklyStart: null,
  shapeCal: null,
  schema: 1,
  categoryEditorMode: false
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      state = Object.assign(state, saved);
    }
  } catch (e) { console.error('loadState error', e); }

  if (!state.categories || !state.categories.length) {
    state.categories = DEFAULT_CATEGORIES.map(c => ({...c}));
  }
  if (!state.currentCategory) {
    state.currentCategory = state.categories[0].id;
  }
  if (!state.currentDate) {
    state.currentDate = todayStr();
  }
  if (!state.data) state.data = {};
  if (!state.settings) state.settings = {};
  if (!state.weeklyStart) {
    state.weeklyStart = todayStr();
  }
  /* 注意：settings 的默认项初始化放在 migrateData 之后的 loadStateDefaults 中，
     以免抢先初始化导致旧数据（checkItems 等）无法迁移 */
}

/* 旧数据迁移（幂等，只跑一次）
   v1 → v2：卡片化随心记/灵感/碎话、视频全局库、移除闲杂琐记
   v2 → v3：打卡项改为按天存储（每日添加，仅当日；原固定项转为常用标签池，
            并为历史日期固化当天清单快照，保留历史勾选记录）
   v3 → v4：形色自修新增月度经期日历视图，无需修改历史 health 字段，初始化 shapeCal 即可
*/
function migrateData() {
  if (state.schema >= 4) return;

  /* ---- v1 → v2 ---- */
  if (!state.schema || state.schema < 2) {
    // 1. 移除「闲杂琐记」模块（其历史数据仍保留在 state.data 中，导出备份可见）
    state.categories = (state.categories || []).filter(c => c.id !== 'cat_misc');

    // 2. 当前分类若已被移除，回到第一个分类
    if (!state.categories.find(c => c.id === state.currentCategory)) {
      state.currentCategory = state.categories[0] ? state.categories[0].id : null;
    }

    if (!state.data) state.data = {};
    if (!state.settings) state.settings = {};

    // 3. 花朝知晤：thought / zhihuVideos -> cards
    Object.keys(state.data.cat_zhihu || {}).forEach(d => {
      const day = state.data.cat_zhihu[d];
      if (day && !Array.isArray(day.cards)) {
        const hasOld = (day.thought && day.thought.trim()) || (Array.isArray(day.zhihuVideos) && day.zhihuVideos.length);
        day.cards = hasOld
          ? [{ id: uid(), text: day.thought || '', videos: Array.isArray(day.zhihuVideos) ? day.zhihuVideos : [] }]
          : [{ id: uid(), text: '', videos: [] }];
      }
    });

    // 4. 故事灵感簿：title/content/storyLinks/storyImages -> inspirations
    Object.keys(state.data.cat_story || {}).forEach(d => {
      const day = state.data.cat_story[d];
      if (day && !Array.isArray(day.inspirations)) {
        const hasOld = (day.title && day.title.trim()) || (day.content && day.content.trim())
          || (Array.isArray(day.storyLinks) && day.storyLinks.length)
          || (Array.isArray(day.storyImages) && day.storyImages.length);
        day.inspirations = hasOld
          ? [{ id: uid(), title: day.title || '', content: day.content || '',
               links: Array.isArray(day.storyLinks) ? day.storyLinks : [],
               images: Array.isArray(day.storyImages) ? day.storyImages : [] }]
          : [{ id: uid(), title: '', content: '', links: [], images: [] }];
      }
    });

    // 5. 说笑备忘录：crumbs -> crumbCards
    Object.keys(state.data.cat_joke || {}).forEach(d => {
      const day = state.data.cat_joke[d];
      if (day && !Array.isArray(day.crumbCards)) {
        day.crumbCards = [{ id: uid(), text: day.crumbs || '' }];
      }
    });

    // 6. 形色自修：各日期的 exerciseVideos / videoLink -> 全局视频库
    if (!state.settings.cat_shape) state.settings.cat_shape = {};
    if (!Array.isArray(state.settings.cat_shape.videos)) state.settings.cat_shape.videos = [];
    if (!Array.isArray(state.settings.cat_shape.videoLinks)) state.settings.cat_shape.videoLinks = [];
    Object.keys(state.data.cat_shape || {}).forEach(d => {
      const day = state.data.cat_shape[d];
      if (!day) return;
      if (Array.isArray(day.exerciseVideos)) {
        day.exerciseVideos.forEach(v => {
          if (v && !state.settings.cat_shape.videos.includes(v)) state.settings.cat_shape.videos.push(v);
        });
      }
      if (day.videoLink && !state.settings.cat_shape.videoLinks.some(l => l.url === day.videoLink)) {
        state.settings.cat_shape.videoLinks.push({ url: day.videoLink, title: day.videoLink });
      }
    });

    state.schema = 2;
  }

  /* ---- v2 → v3：打卡项拆为「每日固定（全局）+ 当日增项（按天）」 ---- */
  if (state.schema === 2) {
    const POOL = { cat_daily: 'checkItems', cat_shape: 'exercise', cat_rui: 'growth', cat_school: 'checkItems' };
    const DONES = { cat_daily: 'checkDones', cat_shape: 'exDones', cat_rui: 'growthDones', cat_school: 'schoolDones' };

    Object.keys(POOL).forEach(cid => {
      if (!state.settings[cid]) state.settings[cid] = {};
      const s = state.settings[cid];

      // 旧固定清单 → 每日固定项（fixedItems）+ 常用标签池（commonChecks，去重）
      if (!Array.isArray(s.fixedItems)) {
        const old = s[POOL[cid]];
        s.fixedItems = Array.isArray(old)
          ? old.map(x => ({ id: x.id || uid(), name: x.name || '' })).filter(x => x.name)
          : [];
      }
      if (!Array.isArray(s.commonChecks)) {
        s.commonChecks = s.fixedItems.map(x => ({ id: x.id, name: x.name }));
      }

      // 每个历史日期：勾选记录迁移为统一的 dayDones（旧字段保留兼容）
      // （固定项每天自动出现，无需快照；旧的当日勾选直接转为 dayDones）
      const dates = state.data[cid] || {};
      Object.keys(dates).forEach(d => {
        const day = dates[d];
        if (!day) return;
        if (!Array.isArray(day.extraItems)) day.extraItems = [];
        const od = day[DONES[cid]];
        if (od && !day.dayDones) day.dayDones = od;
      });
    });

    state.schema = 3;
  }

  /* ---- v3 → v4：经期日历（无需重写历史 health 字段，仅初始化 shapeCal 视图） ---- */
  if (state.schema === 3) {
    const d = new Date(state.currentDate || todayStr() + 'T00:00:00');
    state.shapeCal = { y: d.getFullYear(), m: d.getMonth() };
    // 老字段 intimacy/protect 仍可在日操作面板里被复用，沿用既有 health.* 字段
    state.schema = 4;
  }

  saveState();
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('saveState error', e);
    if (e && e.name === 'QuotaExceededError') {
      toast('存储空间已满，请清理图片');
    }
  }
}

function uid() { return 'id_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function dateOffset(base, days) {
  const d = new Date(base + 'T00:00:00');
  d.setDate(d.getDate() + days);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const da = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${da}`;
}

function formatDateCN(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const w = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 · 星期${w}`;
}

function formatDateShort(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

function ensureData(catId, dateStr) {
  if (!state.data[catId]) state.data[catId] = {};
  if (!state.data[catId][dateStr]) {
    state.data[catId][dateStr] = {};
  }
  return state.data[catId][dateStr];
}

/* 卡片数据（当天） */
function newCard(cid) {
  if (cid === 'cat_zhihu') return { id: uid(), text: '', videos: [] };
  if (cid === 'cat_story') return { id: uid(), title: '', content: '', links: [], images: [] };
  return { id: uid(), text: '' };
}
function getDeckCards(cid) {
  const key = DECK_KEYS[cid];
  if (!key) return null;
  const data = ensureData(cid, state.currentDate);
  if (!Array.isArray(data[key])) data[key] = [newCard(cid)];
  if (!data[key].length) data[key].push(newCard(cid));
  return data[key];
}
function findCard(cid, cardId) {
  const cards = getDeckCards(cid);
  return cards ? (cards.find(c => c.id === cardId) || null) : null;
}

/* ============================================================
   渲染：左侧导航
   ============================================================ */
function renderNav() {
  const wrap = document.getElementById('navList');
  wrap.innerHTML = '';
  const sorted = [...state.categories].sort((a, b) => a.order - b.order);
  sorted.forEach(cat => {
    const div = document.createElement('div');
    div.className = 'nav-item' + (cat.id === state.currentCategory ? ' active' : '');
    div.dataset.id = cat.id;
    if (state.categoryEditorMode) div.classList.add('editing');
    div.innerHTML = `
      <span class="ico">${cat.icon || '🌿'}</span>
      <span class="label">${escapeHTML(cat.name)}</span>
      <span class="nav-tools">
        <button class="icon-btn" data-act="edit" title="编辑">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
        </button>
        <button class="icon-btn" data-act="up" title="上移">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
        <button class="icon-btn" data-act="down" title="下移">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <button class="icon-btn" data-act="del" title="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>
      </span>
    `;
    div.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (btn) {
        e.stopPropagation();
        const act = btn.dataset.act;
        if (act === 'edit') return openCategoryEditor(cat);
        if (act === 'del') return deleteCategory(cat);
        if (act === 'up') return moveCategory(cat, -1);
        if (act === 'down') return moveCategory(cat, 1);
      }
      state.currentCategory = cat.id;
      saveState();
      closeSidebar();
      renderNav();
      renderContent();
    });
    wrap.appendChild(div);
  });
}

function moveCategory(cat, dir) {
  const sorted = [...state.categories].sort((a, b) => a.order - b.order);
  const idx = sorted.findIndex(c => c.id === cat.id);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= sorted.length) return;
  [sorted[idx], sorted[newIdx]] = [sorted[newIdx], sorted[idx]];
  sorted.forEach((c, i) => c.order = i);
  state.categories = sorted;
  saveState();
  renderNav();
}

function deleteCategory(cat) {
  if (!confirm(`确定要删除分类「${cat.name}」吗？\n该分类下的所有数据将被清除。`)) return;
  state.categories = state.categories.filter(c => c.id !== cat.id);
  delete state.data[cat.id];
  delete state.settings[cat.id];
  if (state.currentCategory === cat.id) {
    state.currentCategory = state.categories[0] ? state.categories[0].id : null;
  }
  saveState();
  renderNav();
  renderContent();
}

function openCategoryEditor(cat) {
  const isNew = !cat;
  showModal(`
    <h3>${isNew ? '新增分类' : '编辑分类'}</h3>

      </div>

    <div class="actions">
      <button class="btn" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">保存</button>
    </div>
  `);
  let pickedIcon = isNew ? '🌿' : cat.icon;
  const picker = document.getElementById('iconPicker');
  picker.querySelectorAll('button').forEach(b => {
    if (b.dataset.ic === pickedIcon) b.classList.add('active');
    b.addEventListener('click', () => {
      pickedIcon = b.dataset.ic;
      picker.querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
  });
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('saveBtn').onclick = () => {
    const name = document.getElementById('catNameInput').value.trim();
    if (!name) return toast('请输入分类名称');
    if (isNew) {
      const newCat = { id: 'cat_' + uid(), name, icon: pickedIcon, order: state.categories.length };
      state.categories.push(newCat);
      state.settings[newCat.id] = {};
    } else {
      cat.name = name;
      cat.icon = pickedIcon;
    }
    saveState();
    closeModal();
    renderNav();
  };
}

/* ============================================================
   经期日历：月度视图
   - 数据来源：state.data.cat_shape[date].health
     .period = '经期' 显示粉色
     .intimacy = '有' 显示空心爱心
     .protect = '无' 显示实心爱心（无措施性行为）
   - 排卵 / 安全期：仅根据最近一段经期开始日预估（28 天周期，下次经期-14 天为排卵日）
   ============================================================ */

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function ymdStr(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); }

function getShapeHealth(dateStr) {
  const day = state.data && state.data.cat_shape && state.data.cat_shape[dateStr];
  return (day && day.health) || {};
}

/* 收集所有已记录的经期开始日，并预估排卵 / 安全期 */
function getPeriodMarkers(year, month /* 0-based */) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDates = [];
  if (state.data && state.data.cat_shape) {
    const all = Object.keys(state.data.cat_shape).sort();
    for (let i = 0; i < all.length; i++) {
      const d = all[i];
      if (!d) continue;
      const h = state.data.cat_shape[d].health || {};
      if (h.period === '经期') {
        // 某天的前一天是「非经期」或不存在 → 视为本次经期起点
        const dt = new Date(d + 'T00:00:00');
        const prev = new Date(dt); prev.setDate(prev.getDate() - 1);
        const prevStr = prev.getFullYear() + '-' + pad2(prev.getMonth() + 1) + '-' + pad2(prev.getDate());
        const prevDay = state.data.cat_shape[prevStr];
        const prevPeriod = prevDay && prevDay.health && prevDay.health.period;
        if (prevPeriod !== '经期') firstDates.push(d);
      }
    }
  }
  // 取最近一条经期开始日，作为预测基准
  let refStart = null;
  if (firstDates.length) refStart = firstDates[firstDates.length - 1];
  // 排卵日 = 经期开始日 + (周期长度 - 14)；默认 28 天周期
  const markers = { period: {}, fertile: {}, ovulation: {} };
  // 1) 经期：直接按已记录的 period = '经期' 渲染
  for (let d = 1; d <= daysInMonth; d++) {
    const s = ymdStr(year, month, d);
    const h = getShapeHealth(s);
    if (h.period === '经期') markers.period[s] = true;
  }
  // 2) 排卵/安全期：参考最近一次经期开始日
  if (refStart) {
    const start = new Date(refStart + 'T00:00:00');
    // 排卵日 = 经期开始 + 14（约）
    const ovu = new Date(start); ovu.setDate(ovu.getDate() + 14);
    // 排卵期窗口：排卵前 5 天 ~ 排卵后 1 天
    for (let off = -5; off <= 1; off++) {
      const dt = new Date(ovu); dt.setDate(dt.getDate() + off);
      const s = dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate());
      if (markers.period[s]) continue; // 经期日优先
      if (off === 0) markers.ovulation[s] = true;
      else markers.fertile[s] = true;
    }
  }
  return markers;
}

function renderShapeCalendar(ym, selectedDate) {
  const year = ym.y;
  const month = ym.m;
  const first = new Date(year, month, 1);
  const firstDay = first.getDay(); // 0=Sun
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayD = new Date();
  const todayStr2 = todayD.getFullYear() + '-' + pad2(todayD.getMonth() + 1) + '-' + pad2(todayD.getDate());

  const markers = getPeriodMarkers(year, month);

  // 星期标题：以周一开头
  const wkLabels = ['一', '二', '三', '四', '五', '六', '日'];
  // 占位（本月第一天之前的空格）
  const blanks = (firstDay + 6) % 7; // 周一为列首
  let cells = '';
  for (let i = 0; i < blanks; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const s = ymdStr(year, month, d);
    const h = getShapeHealth(s);
    let cls = ['cal-cell'];
    let mark = '';
    if (markers.period[s]) cls.push('period');
    else if (markers.ovulation[s]) cls.push('ovulation');
    else if (markers.fertile[s]) cls.push('fertile');
    if (s === todayStr2) cls.push('today');
    if (s === selectedDate) cls.push('selected');
    if (s > todayStr2) cls.push('future');
    // 爱心角标
    if (h.intimacy === '有') {
      if (h.protect === '无') {
        mark = '<span class="mark">❤</span>';
      } else {
        mark = '<span class="mark">♡</span>';
      }
    }
    cells += `<div class="${cls.join(' ')}" data-date="${s}"><span class="d">${d}</span>${mark}</div>`;
  }
  return `
    <div class="cal-head">
      <div class="cal-title">${year}年${month + 1}月</div>
      <div class="cal-nav">
        <button data-act="shape-cal-prev" aria-label="上一月">‹</button>
        <button class="cal-today-btn" data-act="shape-cal-today">回今天</button>
        <button data-act="shape-cal-next" aria-label="下一月">›</button>
      </div>
    </div>
    <div class="cal-week">${wkLabels.map(w => `<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">
      <span class="lg"><span class="sw p"></span>经期</span>
      <span class="lg"><span class="sw f"></span>排卵期</span>
      <span class="lg"><span class="sw o"></span>排卵日</span>
      <span class="lg"><span class="sw t"></span>今天</span>
      <span class="lg"><span class="sw h-out">♡</span>有亲密行为</span>
      <span class="lg"><span class="sw h-full">❤</span>无措施性行为</span>
    </div>
  `;
}

/* 每日打卡区块：每日固定项（全局，每天出现）+ 当日增项（仅当天）+ 添加行 + 常用标签
   - 固定项存 settings.fixedItems，每天自动出现（未勾选）
   - 当日增项存 data[date].extraItems，只今天显示，次日清空
   - 勾选状态统一存 data[date].dayDones（按天，不影响其他日期）
*/
function renderDailyCheckSection(cid, opts) {
  opts = opts || {};
  const data = ensureData(cid, state.currentDate);
  const fixed = (state.settings[cid] || {}).fixedItems || [];
  const extra = Array.isArray(data.extraItems) ? data.extraItems : [];
  const pool = (state.settings[cid] || {}).commonChecks || [];
  const extraNames = extra.map(i => i.name);
  const allNames = fixed.map(i => i.name).concat(extraNames);
  const fixedHtml = fixed.length
    ? `<div class="check-sub">每日固定</div>${renderCheckList(fixed, data, 'dayDones')}`
    : `<div class="empty">还没有每日固定项——在下面输入并设为固定，或点常用标签加入今天</div>`;
  const extraHtml = extra.length
    ? `<div class="check-sub">今日增项（仅当天）</div>${renderCheckList(extra, data, 'dayDones')}`
    : '';
  return `
    ${fixedHtml}
    ${extraHtml}
    <div class="add-row">
      <input type="text" data-input="newDayItem" placeholder="${opts.placeholder || '添加打卡项，回车加入今天…'}" />
      <button data-act="quick-check" title="加入今天（仅当天）">＋今日</button>
      <button data-act="add-fixed" title="设为每日固定项">＋固定</button>
    </div>
    ${pool.length ? `
      <div class="chips-row">
        <span class="chips-label">常用</span>
        ${pool.map(c => `<span class="chip${allNames.includes(c.name) ? ' added' : ''}" data-act="add-common" data-pid="${c.id}" title="点击加入今天的清单">${escapeHTML(c.name)}</span>`).join('')}
      </div>
    ` : ''}
    <p class="hint">${opts.hint || '「＋今日」加入的项仅当天显示，次日自动清空；「＋固定」设为每日固定项，之后每天都会出现。勾选记录按天独立保存。'}</p>
  `;
}

function renderPubPreview(data) {
  let s = '';
  if (data.title) s += `# ${data.title}\n\n`;
  s += (data.content || '_（正文内容为空）_');
  if (data.pubLinks && data.pubLinks.length) {
    s += '\n\n— 附链接 —\n';
    data.pubLinks.forEach(l => { s += `• ${l.title || '链接'}：${l.url}\n`; });
  }
  return s;
}

/* ============================================================
   事件绑定
   ============================================================ */
function bindContentEvents(cat) {
  const content = document.getElementById('content');
  const cid = cat.id;

  /* 通用：勾选 / 编辑 / 上下移 / 删除（check-list） */
  content.querySelectorAll('.check-item').forEach(li => {
    const id = li.dataset.id;
    li.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (btn) {
        e.stopPropagation();
        const act = btn.dataset.act;
        if (act === 'edit') return editCheckItem(cid, id);
        if (act === 'del') return deleteCheckItem(cid, id);
        if (act === 'up') return moveCheckItem(cid, id, -1);
        if (act === 'down') return moveCheckItem(cid, id, 1);
      } else {
        toggleCheck(cid, id);
      }
    });
  });

  /* 通用：input/textarea 自动保存（防抖） */
  content.querySelectorAll('[data-input]').forEach(el => {
    const key = el.dataset.input;
    el.addEventListener('input', debounce(() => {
      saveField(cid, key, el.value);
    }, 300));
    el.addEventListener('change', () => {
      saveField(cid, key, el.value);
    });
  });

  /* 通用：快速新增「今日增项」（仅当天）按钮 + 回车 */
  content.querySelectorAll('[data-act="quick-check"]').forEach(b => {
    b.addEventListener('click', () => {
      const input = content.querySelector('[data-input="newDayItem"]');
      if (input && input.value.trim()) {
        addDayItem(cid, input.value.trim());
        input.value = '';
      }
    });
  });
  /* 通用：设为「每日固定项」按钮 */
  content.querySelectorAll('[data-act="add-fixed"]').forEach(b => {
    b.addEventListener('click', () => {
      const input = content.querySelector('[data-input="newDayItem"]');
      if (input && input.value.trim()) {
        addFixedItem(cid, input.value.trim());
        input.value = '';
      }
    });
  });
  content.querySelectorAll('.add-row input[data-input]').forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const btn = inp.parentElement.querySelector('button[data-act="quick-check"]');
        if (btn) btn.click();
      }
    });
  });

  /* 通用：常用标签一键加入今日增项 */
  content.querySelectorAll('[data-act="add-common"]').forEach(chip => {
    chip.addEventListener('click', () => {
      const pool = (state.settings[cid] || {}).commonChecks || [];
      const p = pool.find(x => x.id === chip.dataset.pid);
      if (p) addDayItem(cid, p.name);
    });
  });

  /* 通用：图片添加（非卡片区） */
  content.querySelectorAll('[data-act="add-img"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      triggerImageAdd(cid, btn.dataset.imgKey || defaultImgKey(cid));
    });
  });

  /* 通用：图片删除（区分卡片内 / 普通区） */
  content.querySelectorAll('.image-card [data-act="rm-img"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const i = parseInt(btn.closest('.image-card').dataset.i, 10);
      const cardEl = btn.closest('.swipe-card[data-card-id]');
      if (cardEl) removeCardImage(cid, cardEl.dataset.cardId, i);
      else removeImage(cid, defaultImgKey(cid), i);
    });
  });

  /* ---- 卡片模块（花朝知晤 / 故事灵感簿 / 说笑备忘录） ---- */
  if (DECK_KEYS[cid]) {
    // 滑动 / 箭头 / 指示点
    content.querySelectorAll('.swipe-deck').forEach(deck => bindSwipeDeck(deck));

    // 新增卡片
    content.querySelectorAll('[data-act="add-card"]').forEach(b => {
      b.addEventListener('click', () => addCard(cid));
    });

    // 删除卡片
    content.querySelectorAll('[data-act="del-card"]').forEach(b => {
      b.addEventListener('click', () => {
        const cardEl = b.closest('[data-card-id]');
        if (cardEl) deleteCard(cid, cardEl.dataset.cardId);
      });
    });

    // 卡片内文本输入
    content.querySelectorAll('[data-card-input]').forEach(el => {
      const cardEl = el.closest('[data-card-id]');
      const field = el.dataset.cardInput;
      el.addEventListener('input', debounce(() => {
        const card = findCard(cid, cardEl.dataset.cardId);
        if (card) { card[field] = el.value; saveState(); }
      }, 300));
    });

    // 卡片内链接添加（按钮 + 回车）
    const bindCardLink = (inp) => {
      const doAdd = () => {
        const cardEl = inp.closest('[data-card-id]');
        const v = inp.value.trim();
        if (v) addCardLink(cid, cardEl.dataset.cardId, v);
      };
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); doAdd(); }
      });
      const btn = inp.parentElement.querySelector('button[data-act="card-add-link"]');
      if (btn) btn.addEventListener('click', doAdd);
    };
    content.querySelectorAll('[data-card-link-input]').forEach(bindCardLink);

    // 卡片链接删除
    content.querySelectorAll('[data-act="rm-card-link"]').forEach(b => {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        const cardEl = b.closest('[data-card-id]');
        removeCardLink(cid, cardEl.dataset.cardId, parseInt(b.dataset.i, 10));
      });
    });

    // 卡片图片添加
    content.querySelectorAll('[data-act="card-add-img"]').forEach(b => {
      b.addEventListener('click', (e) => {
        e.preventDefault();
        const cardEl = b.closest('[data-card-id]');
        triggerCardImageAdd(cid, cardEl.dataset.cardId);
      });
    });

    // 卡片视频添加 / 删除
    content.querySelectorAll('[data-act="add-card-video"]').forEach(b => {
      b.addEventListener('click', (e) => {
        e.preventDefault();
        const cardEl = b.closest('[data-card-id]');
        triggerVideoAdd(cid, cardEl.dataset.cardId);
      });
    });
    content.querySelectorAll('[data-act="rm-card-video"]').forEach(b => {
      b.addEventListener('click', () => {
        const cardEl = b.closest('[data-card-id]');
        removeCardVideo(cid, cardEl.dataset.cardId, b.dataset.v);
      });
    });
  }

  /* 形色自修：视频库 */
  if (cid === 'cat_shape') {
    /* 经期日历：单元格点击 → 切到该日 */
    content.querySelectorAll('.cal-cell[data-date]').forEach(c => {
      c.addEventListener('click', () => setShapeSelectedDate(c.dataset.date));
    });
    /* 经期日历：月份翻页 */
    content.querySelectorAll('[data-act="shape-cal-prev"]').forEach(b => {
      b.addEventListener('click', () => shiftShapeMonth(-1));
    });
    content.querySelectorAll('[data-act="shape-cal-next"]').forEach(b => {
      b.addEventListener('click', () => shiftShapeMonth(1));
    });
    content.querySelectorAll('[data-act="shape-cal-today"]').forEach(b => {
      b.addEventListener('click', shapeCalJumpToToday);
    });
    /* 当日操作面板：大姨妈是否 */
    content.querySelectorAll('[data-act="pd-set"]').forEach(b => {
      b.addEventListener('click', () => pdSetPeriod(b.dataset.value));
    });
    /* 爱爱心心切换 */
    const heart = content.querySelector('[data-act="pd-heart"]');
    if (heart) heart.addEventListener('click', pdToggleHeart);

/* 滑动卡片交互 */
function bindSwipeDeck(deck) {
  const track = deck.querySelector('.swipe-track');
  if (!track) return;
  const dots = Array.from(deck.querySelectorAll('.swipe-dot[data-goto]'));
  const step = () => {
    const c = track.querySelector('.swipe-card');
    return c ? (c.offsetWidth + 10) : (track.clientWidth || 300);
  };
  const update = debounce(() => {
    const idx = Math.round(track.scrollLeft / step());
    dots.forEach((d, i) => d.classList.toggle('on', i === idx));
  }, 60);
  track.addEventListener('scroll', update, { passive: true });
  dots.forEach(d => d.addEventListener('click', () => {
    const i = parseInt(d.dataset.goto, 10);
    const el = track.children[i];
    if (el) track.scrollTo({ left: el.offsetLeft, behavior: 'smooth' });
  }));
  deck.querySelectorAll('.swipe-arrow').forEach(a => a.addEventListener('click', () => {
    track.scrollBy({ left: parseInt(a.dataset.arrow, 10) * step(), behavior: 'smooth' });
  }));
}

function debounce(fn, wait) {
  let t;
  return function(...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), wait);
  };
}

function saveField(cid, key, value) {

  if (key.startsWith('health.')) {

  } else if (key === 'height' || key === 'ruiWeight' || key === 'diet' || key === 'sleep' || key === 'observe') {
    if (!data.records) data.records = {};

    return;
  } else {

  }

}

/* ============================================================
   每日打卡项：「每日固定」（全局，每天出现）+「今日增项」（仅当天）
   - 固定项存 settings.fixedItems，增删同步所有日期
   - 当日增项存 data[date].extraItems，次日清空
   - 勾选状态统一存 data[date].dayDones（按天独立）
   ============================================================ */
function getExtraItems(cid) {
  const data = ensureData(cid, state.currentDate);
  if (!Array.isArray(data.extraItems)) data.extraItems = [];
  return data.extraItems;
}
function getFixedItems(cid) {
  if (!state.settings[cid]) state.settings[cid] = {};
  if (!Array.isArray(state.settings[cid].fixedItems)) state.settings[cid].fixedItems = [];
  return state.settings[cid].fixedItems;
}
/* 按 itemId 定位所在列表（固定项 or 当日增项） */
function findItemList(cid, itemId) {
  const fixed = getFixedItems(cid);
  if (fixed.some(x => x.id === itemId)) return fixed;
  const extra = getExtraItems(cid);
  if (extra.some(x => x.id === itemId)) return extra;
  return null;
}

function toggleCheck(cid, itemId) {
  const data = ensureData(cid, state.currentDate);
  if (!data.dayDones) data.dayDones = {};
  data.dayDones[itemId] = !data.dayDones[itemId];
  saveState();
  renderContent();
}

  if (fixed.some(x => x.name === name) || extra.some(x => x.name === name)) {
    return toast('今天已有这项了');

  extra.push({ id: uid(), name, order: extra.length });

  if (!state.settings[cid].commonChecks.some(x => x.name === name)) {

}

/* ============================================================
   连续打卡天数（当日「固定项 + 增项」全部勾完记 1 天）
   ============================================================ */
function isDayAllDone(cid, dateStr) {
  const fixed = (state.settings[cid] || {}).fixedItems || [];
  const dayData = (state.data[cid] || {})[dateStr];
  const extra = (dayData && dayData.extraItems) || [];
  const items = fixed.concat(extra);
  if (!items.length) return false;
  const dones = (dayData && dayData.dayDones) || {};
  return items.every(it => dones[it.id]);
}

function computeStreak(cid) {
  let streak = 0;
  let d = todayStr();
  if (!isDayAllDone(cid, d)) d = dateOffset(d, -1);
  for (let i = 0; i < 3650; i++) {
    if (isDayAllDone(cid, d)) { streak++; d = dateOffset(d, -1); }
    else break;
  }
  return streak;
}

function handleFiles(files) {
  if (!pendingImg) return;
  const target0 = pendingImg;
  pendingImg = null;
  const imgs = Array.from(files).filter(f => f.type && f.type.startsWith('image/')).slice(0, 9);
  if (!imgs.length) return;

  let target = null;
  if (target0.cardId) {
    const card = findCard(target0.cid, target0.cardId);
    if (!card) return;
    if (!Array.isArray(card.images)) card.images = [];
    target = card.images;
  } else {
    const data = ensureData(target0.cid, state.currentDate);
    if (!Array.isArray(data[target0.key])) data[target0.key] = [];
    target = data[target0.key];
  }

  let done = 0;
  imgs.forEach(f => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      compressImage(ev.target.result, 1280, 0.78).then(small => {
        target.push(small);
        done++;
        if (done === imgs.length) {
          saveState();
          renderContent();
        }
      });
    };
    reader.readAsDataURL(f);
  });
}

function compressImage(dataUrl, maxSize, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const w = img.width, h = img.height;
      let tw = w, th = h;
      if (w > maxSize || h > maxSize) {
        if (w > h) { tw = maxSize; th = Math.round(h * (maxSize / w)); }
        else { th = maxSize; tw = Math.round(w * (maxSize / h)); }
      }
      const canvas = document.createElement('canvas');
      canvas.width = tw; canvas.height = th;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, tw, th);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

  if (Array.isArray(data[key])) {

/* ============================================================
   视频媒资：存 IndexedDB（避免撑爆 localStorage）
   ============================================================ */
const MEDIA_DB_NAME = 'huazhao_media_v1';
function openMediaDB() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('no idb')); return; }
    const req = indexedDB.open(MEDIA_DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('media')) db.createObjectStore('media');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function mediaPut(id, blob) {
  return openMediaDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction('media', 'readwrite');
    tx.objectStore('media').put(blob, id);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  }));
}
function mediaGet(id) {
  return openMediaDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction('media', 'readonly');
    const r = tx.objectStore('media').get(id);
    r.onsuccess = () => res(r.result || null);
    r.onerror = () => rej(r.error);
  }));
}
function mediaDelete(id) {
  if (!id) return Promise.resolve();
  return openMediaDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction('media', 'readwrite');
    tx.objectStore('media').delete(id);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  }));
}
let _videoBlobUrls = [];
function resolveMedia(content) {
  _videoBlobUrls.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) {} });
  _videoBlobUrls = [];
  content.querySelectorAll('[data-vid]').forEach(el => {
    const id = el.dataset.vid;
    mediaGet(id).then(blob => {
      if (!blob) return;
      const u = URL.createObjectURL(blob);
      _videoBlobUrls.push(u);
      el.src = u;
      if (el.load) el.load();
    }).catch(() => {});
  });
}

/* 视频上传：目标 = 全局视频库（形色自修）或某张卡片（花朝知晤） */
let pendingVideo = null; // {cid, cardId} 或 {cid, lib:true}
function triggerVideoAdd(cid, cardId, lib) {
  pendingVideo = lib ? { cid, lib: true } : { cid, cardId };
  const vi = document.getElementById('videoInput');
  vi.value = '';
  vi.click();
}

function handleVideoFiles(files) {
  const target = pendingVideo;
  pendingVideo = null;
  if (!target) return;
  const all = Array.from(files || []);
  const valid = all.filter(f => f.type && f.type.startsWith('video/'));
  if (!valid.length) return toast('请选择视频文件');
  const tooBig = valid.filter(f => f.size > 2000 * 1024 * 1024).length;
  const list = valid.filter(f => f.size <= 2000 * 1024 * 1024);
  if (tooBig) toast(`已跳过 ${tooBig} 个超过 2GB 的视频`);
  if (!list.length) return;

  const entries = list.map(f => ({ id: 'vid_' + uid(), f }));
  Promise.all(entries.map(en => mediaPut(en.id, en.f))).then(() => {
    if (target.lib) {
      const s = state.settings.cat_shape;
      if (!Array.isArray(s.videos)) s.videos = [];
      entries.forEach(en => s.videos.push(en.id));
    } else {
      const card = findCard(target.cid, target.cardId);
      if (card) {
        if (!Array.isArray(card.videos)) card.videos = [];
        entries.forEach(en => card.videos.push(en.id));
      }
    }
    saveState();
    renderContent();
    toast(`已保存 ${entries.length} 个视频 ✓`);
  }).catch(() => toast('视频保存失败（本机存储空间可能不足；可尝试更短或更清晰的片段）'));
}

/* 视频库操作（形色自修） */
function toggleLibVideo(vid) {
  const data = ensureData('cat_shape', state.currentDate);
  if (!data.videoDones) data.videoDones = {};
  data.videoDones[vid] = !data.videoDones[vid];
  saveState();
  renderContent();
}
function removeLibVideo(vid) {
  if (!confirm('确定从视频库删除这个视频吗？\n其他视频与历史跟练记录不受影响。')) return;
  const s = state.settings.cat_shape;
  s.videos = (s.videos || []).filter(v => v !== vid);
  saveState();
  renderContent();
  mediaDelete(vid).catch(() => {});
}

/* ============================================================
   每日推荐文稿
   ============================================================ */
function getDailyScriptIndex(dateStr, override) {
  if (override != null && STANDUP_SCRIPTS[override]) return override;
  let h = 0;
  for (let i = 0; i < dateStr.length; i++) h = (h * 31 + dateStr.charCodeAt(i)) >>> 0;
  return h % STANDUP_SCRIPTS.length;
}
function getDailyScript(dateStr, override) {
  return STANDUP_SCRIPTS[getDailyScriptIndex(dateStr, override)];
}

/* ============================================================
   学堂杂务：周计算
   ============================================================ */
function computeWeek(startStr, currentStr) {
  if (!startStr) return { auto: '', label: '' };
  const start = new Date(startStr + 'T00:00:00');
  const cur = new Date(currentStr + 'T00:00:00');
  const diffDays = Math.floor((cur - start) / (1000 * 60 * 60 * 24));
  const weekIndex = diffDays < 0 ? 0 : Math.floor(diffDays / 7) + 1;
  const weekStart = new Date(start);
  weekStart.setDate(start.getDate() + (weekIndex - 1) * 7);
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6);
  const fmt = (d) => `${d.getMonth() + 1}月${d.getDate()}日`;
  const auto = `${fmt(weekStart)} — ${fmt(weekEnd)} · 第${weekIndex}周`;
  const label = `当前位于第 ${weekIndex} 周（${fmt(weekStart)} - ${fmt(weekEnd)}）`;
  return { auto, label };
}

/* ============================================================
   AI 草稿生成（本地模板，无后端）
   ============================================================ */
function generateAIPolish(kind) {
  const cid = state.currentCategory;
  const data = ensureData(cid, state.currentDate);
  if (kind === 'zhihu') {
    const cards = getDeckCards('cat_zhihu');
    const src = cards.map(c => (c.text || '').trim()).filter(Boolean).join('\n');
    if (!src) return toast('请先在「随心记」写一些想法');
    data.aiPolish = polishForDouyin(src);
  }
  saveState();
  renderContent();
}

function polishForDouyin(text) {
  const lines = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
  const first = lines[0] || text.split(/[，。！？,!?]/)[0];
  return `【抖音口播·润色稿】

🎬 开头（3秒钩子）：
姐妹们，你们有没有过这样的瞬间 —— ${first.slice(0, 28)}…

📖 正文：
${lines.map((l, i) => `${i + 1}. ${l}`).join('\n')}

✨ 收尾（共鸣金句）：
所以啊，生活哪有什么标准答案，心里有光，脚下就有路。我是花朝，今天的感悟，送给同样在路上的你。

— 改编自你今日的「随心记」—`;
}

function copyText(text) {
  if (!text) return toast('暂无内容可复制');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => toast('已复制到剪贴板'), () => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('复制失败'); }
  document.body.removeChild(ta);
}

/* ============================================================
   数据备份：导出 / 导入
   ============================================================ */
function exportBackup() {
  try {
    const payload = {
      app: 'huazhao-workbench',
      version: 2,
      exportedAt: new Date().toISOString(),
      state: {
        categories: state.categories,
        currentCategory: state.currentCategory,
        currentDate: state.currentDate,
        data: state.data,
        settings: state.settings,
        weeklyStart: state.weeklyStart,
        schema: state.schema
      }
    };
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `花朝工作台备份_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('备份已导出，请妥善保存该文件');
  } catch (e) {
    console.error(e);
    toast('导出失败');
  }
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      const incoming = parsed && parsed.state ? parsed.state : parsed;
      if (!incoming || !incoming.categories || !incoming.data) {
        return toast('文件格式不正确，无法导入');
      }
      if (!confirm('导入将覆盖当前所有数据，确定继续吗？\n（建议先导出一份当前备份）')) return;
      state.categories = incoming.categories || state.categories;
      state.currentCategory = incoming.currentCategory || (state.categories[0] ? state.categories[0].id : null);
      state.currentDate = incoming.currentDate || todayStr();
      state.data = incoming.data || {};
      state.settings = incoming.settings || {};
      state.weeklyStart = incoming.weeklyStart || todayStr();
      state.schema = incoming.schema || 1;
      migrateData();
      loadStateDefaults();
      saveState();
      renderNav();
      renderContent();
      toast('备份已导入，数据已恢复');
    } catch (e) {
      console.error(e);
      toast('解析失败，文件可能已损坏');
    }
  };
  reader.readAsText(file);
}

/* 导入后补齐缺失的默认 settings 结构（不覆盖已有内容） */
function loadStateDefaults() {
  if (!state.categories || !state.categories.length) {
    state.categories = DEFAULT_CATEGORIES.map(c => ({...c}));
  }
  if (!state.currentCategory || !state.categories.find(c => c.id === state.currentCategory)) {
    state.currentCategory = state.categories[0] ? state.categories[0].id : null;
  }
  if (!state.currentDate) state.currentDate = todayStr();
  if (!state.data) state.data = {};
  if (!state.settings) state.settings = {};
  if (!state.weeklyStart) state.weeklyStart = todayStr();
  state.categories.forEach(cat => {
    if (!state.settings[cat.id]) state.settings[cat.id] = {};
    if (cat.id === 'cat_shape') {
      if (!Array.isArray(state.settings[cat.id].fixedItems)) {
        state.settings[cat.id].fixedItems = DEFAULT_CHECKS.cat_shape.exercise.map((n, i) => ({ id: uid(), name: n, order: i }));
      }
      if (!Array.isArray(state.settings[cat.id].videos)) state.settings[cat.id].videos = [];
      if (!Array.isArray(state.settings[cat.id].videoLinks)) state.settings[cat.id].videoLinks = [];
    } else if (cat.id === 'cat_rui') {
      if (!Array.isArray(state.settings[cat.id].fixedItems)) {
        state.settings[cat.id].fixedItems = DEFAULT_CHECKS.cat_rui.growth.map((n, i) => ({ id: uid(), name: n, order: i }));
      }
    } else if (DEFAULT_CHECKS[cat.id]) {
      if (!Array.isArray(state.settings[cat.id].fixedItems)) {
        state.settings[cat.id].fixedItems = DEFAULT_CHECKS[cat.id].map((n, i) => ({ id: uid(), name: n, order: i }));
      }
    }
  });
}

/* ============================================================
   全局事件
   ============================================================ */
const APP_VERSION = '2026.08.26.v2'; // 每次更新 GitHub Pages 时改这个版本号

function setupGlobalEvents() {
  document.getElementById('menuBtn').addEventListener('click', () => {
    toggleSidebar();
  });
  document.getElementById('scrim').addEventListener('click', () => {
    closeSidebar();
  });

  document.getElementById('prevDayBtn').addEventListener('click', () => {
    state.currentDate = dateOffset(state.currentDate, -1);
    saveState();
    renderContent();
  });
  document.getElementById('nextDayBtn').addEventListener('click', () => {
    state.currentDate = dateOffset(state.currentDate, 1);
    saveState();
    renderContent();
  });
  document.getElementById('todayBtn').addEventListener('click', () => {
    state.currentDate = todayStr();
    saveState();
    renderContent();
    toast('已回到今天');
  });

  document.getElementById('addCategoryBtn').addEventListener('click', () => openCategoryEditor(null));
  document.getElementById('manageCategoryBtn').addEventListener('click', () => {
    state.categoryEditorMode = !state.categoryEditorMode;
    toast(state.categoryEditorMode ? '编辑模式：可改名/排序/删除' : '已退出编辑模式');
    renderNav();
  });

  document.getElementById('exportBtn').addEventListener('click', exportBackup);
  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('backupFileInput').value = '';
    document.getElementById('backupFileInput').click();
  });
  document.getElementById('backupFileInput').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) importBackup(file);
  });

  /* 检查更新：抓取远程 index.html 的版本号，与本页对比 */
  const checkUpdateBtn = document.getElementById('checkUpdateBtn');
  const updateBtnLabel = document.getElementById('updateBtnLabel');
  if (checkUpdateBtn) {
    checkUpdateBtn.addEventListener('click', () => {
      updateBtnLabel.textContent = '检查中…';
      fetch('./index.html', { cache: 'no-store' })
        .then(r => r.text())
        .then(html => {
          const m = html.match(/const APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
          const remoteVersion = m ? m[1] : null;
          if (!remoteVersion) {
            toast('未能读取远程版本');
            updateBtnLabel.textContent = '检查更新';
            return;
          }
          if (remoteVersion !== APP_VERSION) {
            checkUpdateBtn.classList.add('has-new');
            updateBtnLabel.textContent = '🎉 有新版本 ' + remoteVersion;
            if (confirm('检测到新版本 ' + remoteVersion + '，当前版本 ' + APP_VERSION + '。\n刷新页面即可更新吗？')) {
              window.location.reload(true);
            }
          } else {
            checkUpdateBtn.classList.remove('has-new');
            updateBtnLabel.textContent = '已是最新 ' + APP_VERSION;
            toast('当前已是最新版本');
          }
        })
        .catch(() => {
          toast('检查失败，请确认网络或手动刷新');
          updateBtnLabel.textContent = '检查更新';
        });
    });
  }

  document.getElementById('modalMask').addEventListener('click', (e) => {
    if (e.target.id === 'modalMask') closeModal();
  });

  document.getElementById('fileInput').addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length) handleFiles(files);
  });

  document.getElementById('videoInput').addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length) handleVideoFiles(files);
  });

  // 触屏：侧栏滑出/收起
  let touchStartX = 0, touchStartY = 0, touchStartT = 0;
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartT = Date.now();
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    if (e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const dt = Date.now() - touchStartT;
    if (dt > 600) return;
    if (Math.abs(dy) > 60) return;
    const sb = document.getElementById('sidebar');
    if (dx < -60 && !sb.classList.contains('hidden')) {
      closeSidebar();
    } else if (dx > 60 && sb.classList.contains('hidden') && touchStartX < 30) {
      openSidebar();
    }
  }, { passive: true });

  // 桌面：左缘拖拽呼出侧栏
  let mouseDown = false, mouseStartX = 0;
  document.addEventListener('mousedown', (e) => {
    if (e.clientX > 40) return;
    mouseDown = true; mouseStartX = e.clientX;
  });
  document.addEventListener('mouseup', (e) => {
    if (!mouseDown) return;
    mouseDown = false;
    const dx = e.clientX - mouseStartX;
    const sb = document.getElementById('sidebar');
    if (dx > 80 && sb.classList.contains('hidden')) {
      openSidebar();
    }
  });

  document.getElementById('main').addEventListener('click', (e) => {
    const sb = document.getElementById('sidebar');
    if (!sb.classList.contains('hidden') && (e.target.id === 'main' || e.target.classList.contains('content'))) {
      closeSidebar();
    }
  });
}

function openSidebar() {
  document.getElementById('sidebar').classList.remove('hidden');
  document.getElementById('scrim').classList.add('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.add('hidden');
  document.getElementById('scrim').classList.remove('show');
}
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  if (sb.classList.contains('hidden')) openSidebar();
  else closeSidebar();
}

/* ============================================================
   启动
   ============================================================ */
function init() {
  loadState();
  migrateData();
  loadStateDefaults();
  setupGlobalEvents();
  renderNav();
  renderContent();
  if (!localStorage.getItem(STORAGE_KEY + '_seen')) {
    localStorage.setItem(STORAGE_KEY + '_seen', '1');
    openSidebar();
  }
}

init();
</script>
